name: 'cvu_dining'
version: '1.0.0'
config-version: 2

profile: 'retail_ops_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  cvu_dining:
    # Staging models (views for fast iteration)
    staging:
      +materialized: view
      +schema: staging_cvu_dining
      
    # Intermediate models (ephemeral - no tables created)
    intermediate:
      +materialized: ephemeral
      
    # Marts models (tables for production)
    marts:
      +materialized: table
      +schema: marts_cvu_dining

seeds:
  cvu_dining:
    +schema: seeds_cvu_dining
    meal_plans:
      +column_types:
        dining_dollars: FLOAT64
        convenience_points: FLOAT64
        price_per_semester: FLOAT64